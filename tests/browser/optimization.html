<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass optimization evidence</title>
<style>
  * { box-sizing: border-box; } body { margin: 20px; font: 14px system-ui; background: #f4f5f7; color: #172329; }
  button,select { font: inherit; padding: 7px; margin: 3px; } label { margin-right: 12px; }
  .pair { display: flex; gap: 20px; margin: 16px 0; } .quality-stage { width: 600px; height: 360px; }
  .surface { position: absolute; display: grid; place-items: center; color: #172329; }
  .lg-content { font: 16px system-ui; } .lg-content input { width: 130px; }
  #status { min-height: 24px; } #results { width: 100%; height: 200px; font: 11px monospace; }
  #performance-host { margin: 15px 0; } h2 { font-size: 16px; }
</style>
<h1>Optimization evidence · pinned baseline / current sources</h1>
<p>Development fixture. Renderer DPR is explicitly overridden to test 1×/2× buffers. Performance uses 960×540, DPR 1 and repeated paired runs; CPU submission and rAF are not GPU timestamps.</p>
<label>Backend <select id="backend"><option>svg</option><option>webgpu</option><option>webgl</option><option>css</option><option>solid</option></select></label>
<label>Look <select id="look"><option>clear</option><option>frosted</option><option>reading</option></select></label>
<label>Backdrop <select id="background"><option>testchart</option><option>gradient</option><option>image</option></select></label>
<label>Renderer DPR <select id="dpr"><option>1</option><option>2</option></select></label>
<label>Geometry <select id="geometry"><option>normal</option><option>thin</option><option>resize</option></select></label>
<button id="render">Render pair</button><button id="checks">Check invalidation and allocations</button><button id="benchmark">Run paired performance</button>
<p id="status" role="status">Loading baseline</p>
<div class="pair"><section><h2>Baseline</h2><div id="baseline-stage" class="lg-stage quality-stage"></div></section><section><h2>Current</h2><div id="current-stage" class="lg-stage quality-stage"></div></section></div>
<div id="performance-host"></div>
<textarea id="results" aria-label="Evidence JSON" readonly></textarea>
<script type="module" src="./optimization.js"></script>
</html>
